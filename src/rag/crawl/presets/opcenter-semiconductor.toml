# rag-crawl preset: Opcenter Execution Semiconductor / Camstar Semiconductor Suite.
#   rag-crawl run --preset opcenter-semiconductor OUT --budget 2GB
# Copy it with `rag-crawl preset opcenter-semiconductor > semi.toml` to edit.

[topic]
name = "Opcenter Execution Semiconductor / Camstar Semiconductor Suite"
# Every kept file must name the product family at least twice (a title hit counts double)...
terms = [
  "opcenter execution semiconductor", "camstar semiconductor suite", "camstar semiconductor",
  "opcenter semiconductor", "opcenter", "camstar",
]
min_term_hits = 2
# ...and also mention the semiconductor side at least twice. This drops Opcenter
# Medical Device, Pharma, Process and Discrete material that never touches a fab.
also_required = [
  "semiconductor", "semiconductors", "semi", "wafer", "wafers", "wafer sort", "wafer map", "fab", "fabs",
  "foundry", "osat", "assembly and test", "die", "die bank", "secs", "gem300", "300mm", "200mm",
  "reticle", "lithography", "probe card", "wafer level", "packaging and test",
]
also_required_min_hits = 2
# Score only.
related = [
  "manufacturing execution", "mes", "camstar enterprise platform", "cep", "modeling", "container",
  "lot", "split", "merge", "genealogy", "hold", "rework", "recipe management", "equipment integration",
  "dispatching", "wip", "yield", "spc", "durable", "carrier", "sampling", "release notes", "what's new",
  "fact sheet", "case study",
]
languages = ["en"]

[crawl]
seeds = [
  "https://www.siemens.com/en-us/products/opcenter/execution/semiconductor/",
  "https://blogs.sw.siemens.com/opcenter/tag/semiconductors/",
  "https://blogs.sw.siemens.com/thought-leadership/product/camstar-semiconductor-suite/",
  "https://blogs.sw.siemens.com/opcenter/",
  "https://resources.sw.siemens.com/en-US/",
  # Older fact sheets in Siemens' media library (no longer linked from the current site).
  "https://www.plm.automation.siemens.com/media/global/de/Siemens_SW_Opcenter_Excecution_Semiconductor_8_6_Fact_Sheet_tcm53-91477.pdf",
  "https://www.plm.automation.siemens.com/media/global/de/Siemens%20SW%20Siemens%20Opcenter%20Execution%20Semiconductor%208-1%20FS_tcm53-69489.pdf",
  "https://www.plm.automation.siemens.com/media/global/de/Siemens%20SW%20Whats%20new%20in%20Siemens%20Opcenter%20Execution%20Semiconductor%208-0%20FS_tcm53-67551.pdf",
  "https://www.plm.automation.siemens.com/media/global/cz/Siemens%20SW-Siemens-Opcenter-Execution-Semiconductor-2210-Fact%20Sheet%281%29_tcm84-109029.pdf",
  "https://www.plm.automation.siemens.com/media/global/cz/Siemens-PLM-Whats-new-in-Camstar-Semiconductor-Suite-V7-SU6-fs-73745-A4_tcm84-46649.pdf",
  "https://media.plm.automation.siemens.com/de_de/hannover-fair/collaterals/09.3-Siemens-PLM-Camstar-Semiconductor-Suite.pdf",
  # Trade press coverage.
  "https://compoundsemiconductor.net/article/89762/Emcore_replaces_legacy_systems_with_Camstar_Semiconductor_Suite",
  "https://siliconsemiconductor.net/article/98457/The_Siemens_Camstar_Semiconductor_Suite",
]
# docs.sw.siemens.com disallows crawlers and Support Center content needs a login,
# so the product manuals themselves are out of reach; this collects public material.
allowed_domains = ["siemens.com"]
follow_external = true
max_offsite_hops = 1
max_tunnel = 1
max_depth = 8
max_pages_per_host = 20000
delay_s = 1.0
workers = 4
max_file_mb = 200
html_min_words = 250

[search]
# Optional: "brave" (BRAVE_API_KEY env var) or "searxng" (searxng_url).
provider = ""
queries = [
  "\"Opcenter Execution Semiconductor\"",
  "\"Opcenter Execution Semiconductor\" filetype:pdf",
  "\"Camstar Semiconductor Suite\"",
  "\"Camstar Semiconductor Suite\" filetype:pdf",
  "\"Opcenter Execution Semiconductor\" what's new",
  "\"Opcenter Execution Semiconductor\" OSAT",
  "Camstar semiconductor MES wafer fab case study",
  "Camstar MES semiconductor backend assembly test",
  "\"Opcenter\" semiconductor equipment integration SECS/GEM",
  "Siemens Camstar semiconductor customer MES implementation",
]
pages_per_query = 5

[sitemaps]
enabled = true
max_files = 300
