[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-builder"
version = "0.3.1"
description = "Builds SQLite + sqlite-vec RAG packs from mixed documents, with a small Python retrieval path for testing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "sqlite-vec==0.1.9",
  "numpy>=1.26",
  "charset-normalizer>=3.3",
  "pypdfium2>=4.30",
  "pdfplumber>=0.11",
  "rapidocr-onnxruntime>=1.2",
  "onnxruntime>=1.18",
  "pillow>=10",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "beautifulsoup4>=4.12",
  "sqlglot>=25",
  "tree-sitter>=0.23",
  "tree-sitter-c-sharp>=0.23",
  "tokenizers>=0.19",
]

[project.optional-dependencies]
docling = ["docling>=2.100"]
llamacpp = ["llama-cpp-python>=0.3"]
onnx = ["qwen3-embed>=1.14"]
sqlite = ["sqlean.py>=3.45"]   # for Pythons built without SQLite extension loading
dev = ["pytest>=8", "reportlab>=4"]

[project.scripts]
rag = "rag.cli:main"
rag-crawl = "rag.crawl.cli:main"
rag-engine = "rag.app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rag.core.db" = ["*.sql"]
"rag.crawl.presets" = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
