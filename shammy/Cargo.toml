[workspace]
resolver = "2"
members = ["crates/shammy-core", "crates/shammy-cli", "crates/shammy-rag", "crates/shammy-ffi", "crates/shammy-py"]
default-members = ["crates/shammy-core", "crates/shammy-cli", "crates/shammy-rag", "crates/shammy-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
