[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "shammy"
version = "0.1.0"
description = "Shammy: a single-file vector store for read-mostly knowledge bases"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
sqlite-vec = ["sqlite-vec>=0.1"]

[project.scripts]
shammy-convert = "shammy.convert:main"

[tool.maturin]
module-name = "shammy._native"
python-source = "python"
features = ["pyo3/extension-module"]
