[package]
name = "shammy-py"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Python bindings for the Shammy vector store"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
shammy-core = { path = "../shammy-core" }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
