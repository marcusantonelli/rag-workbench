# Builds the RAG Workbench installers:
#   Windows: .exe (NSIS, per-user, no admin needed) and .msi
#   Linux:   .deb and .AppImage (built on Ubuntu 22.04 so they run on older distros too)
# Runs on version tags (v0.3.0, ...) and on demand from the Actions tab.
name: Desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-22.04
            bundles: deb,appimage

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - name: Verify Windows bundler dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Checking WiX..."
          Get-Command candle.exe -ErrorAction Stop
          Get-Command light.exe -ErrorAction Stop

          Write-Host "Checking NSIS provisioning..."
          Write-Host "Tauri will automatically download and configure NSIS 3.13."

          Write-Host "Windows bundler prerequisites verified."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Freeze the engine
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pyinstaller>=6.10" "maturin>=1.7,<2"
          # the Shammy vector engine, as a Python module the engine bundles
          (cd shammy/crates/shammy-py && maturin build --release --out ../../target/wheels)
          python -m pip install shammy/target/wheels/shammy-*.whl
          # OCR needs OpenCV but not its GUI: the headless build is ~100 MB smaller.
          python -m pip uninstall -y opencv-python || true
          python -m pip install opencv-python-headless
          python desktop/scripts/build_engine.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Node dependencies
        working-directory: desktop
        run: npm ci

      - name: Build installers
        working-directory: desktop
        shell: bash
        env:
          # the updater's signing key (repository secrets); without it the installers are built
          # unsigned and no update is published
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          extra=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            extra=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          npx tauri build --verbose --bundles ${{ matrix.bundles }} "${extra[@]}"

      - name: Verify generated installers
        shell: bash
        run: |
          echo "Checking generated installers..."

          find desktop/src-tauri/target/release/bundle -type f

      - name: Shammy library for the retrieval server
        shell: bash
        run: |
          cargo build --release -p shammy-ffi --manifest-path shammy/Cargo.toml
          mkdir -p shammy-native
          cp shammy/include/shammy.h shammy-native/
          # the .NET wrapper's source, to copy into the server project (see README-dotnet.md)
          mkdir -p shammy-native/dotnet
          cp shammy/dotnet/Shammy/ShammyIndex.cs shammy/dotnet/Shammy/ShammyRetriever.cs shammy-native/dotnet/
          cp shammy/dotnet/README.md shammy-native/README-dotnet.md
          cp shammy/target/release/shammy.dll shammy-native/ 2>/dev/null || cp shammy/target/release/libshammy.so shammy-native/
          (cd shammy-native && 7z a ../shammy-native-${{ runner.os }}.zip . >/dev/null 2>&1 || zip -qr ../shammy-native-${{ runner.os }}.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: rag-workbench-${{ runner.os }}
          path: |
            shammy-native-*.zip
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/msi/*.msi.sig
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

  # One job attaches every platform's files to the draft release, with latest.json for the
  # app's updater (made from the signatures and this version's release notes).
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: rag-workbench-*
          path: dist
          merge-multiple: true

      - name: Updater manifest
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if python3 desktop/scripts/make_latest_json.py --dist dist --repo "${{ github.repository }}" \
               --tag "${GITHUB_REF_NAME}" --notes "docs/release-notes/${version}.md" --out latest.json; then
            echo "Updater manifest written."
          else
            echo "No signed installers: this release won't be offered as an update."
            rm -f latest.json
          fi

      # a tag with a hyphen (v0.4.3-beta.1) is a pre-release: GitHub's "latest" skips it, so only
      # apps that chose "Also offer pre-releases" are offered it (see update-feed.yml)
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
          files: |
            dist/**/shammy-native-*.zip
            dist/**/*.exe
            dist/**/*.msi
            dist/**/*.deb
            dist/**/*.AppImage
            latest.json
