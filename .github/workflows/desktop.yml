# Builds the RAG Workbench installers:
#   Windows: .exe (NSIS, per-user, no admin needed) and .msi
#   Linux:   .deb and .AppImage (built on Ubuntu 22.04 so they run on older distros too)
# Runs on version tags (v0.3.0, ...) and on demand from the Actions tab.
name: Desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-22.04
            bundles: deb,appimage

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - name: Verify Windows bundler dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Checking WiX..."
          Get-Command candle.exe -ErrorAction Stop
          Get-Command light.exe -ErrorAction Stop

          Write-Host "Checking NSIS provisioning..."
          Write-Host "Tauri will automatically download and configure NSIS 3.13."

          Write-Host "Windows bundler prerequisites verified."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Freeze the engine
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pyinstaller>=6.10"

          python -m pip uninstall -y opencv-python || true
          python -m pip install opencv-python-headless

          python desktop/scripts/build_engine.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Node dependencies
        working-directory: desktop
        run: npm ci

      - name: Build installers
        working-directory: desktop
        run: npx tauri build --verbose --bundles ${{ matrix.bundles }}

      - name: Verify generated installers
        shell: bash
        run: |
          echo "Checking generated installers..."

          find desktop/src-tauri/target/release/bundle -type f

      - uses: actions/upload-artifact@v4
        with:
          name: rag-workbench-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
